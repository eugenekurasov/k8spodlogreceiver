name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    name: k8s ${{ matrix.k8s-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # run all three even if one fails
      matrix:
        include:
          # Verify exact patch tags at https://github.com/kubernetes-sigs/kind/releases
          - k8s-version: "1.37"
            kind-image: "kindest/node:v1.37.0"
          - k8s-version: "1.36"
            kind-image: "kindest/node:v1.36.4"
          - k8s-version: "1.35"
            kind-image: "kindest/node:v1.35.8"
          - k8s-version: "1.34"
            kind-image: "kindest/node:v1.34.11"

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cache vendor
        id: cache-vendor
        uses: actions/cache@v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-go-vendor-${{ hashFiles('go.sum') }}

      - name: Vendor dependencies
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: go mod vendor

      - name: Create kind cluster (k8s ${{ matrix.k8s-version }})
        uses: helm/kind-action@v1.15.0
        with:
          node_image: ${{ matrix.kind-image }}
          cluster_name: k8spodlog-test

      - name: Run tests
        run: go test -v -mod=vendor -tags integration -timeout 180s ./...
