receivers:
  k8s_pod_log:
    namespaces: [payment, api-gateway]
    pod_label_selector: app.kubernetes.io/part-of=payments
    since_seconds: 300
    pod_resync_period: 10m
    api_config:
      auth_type: serviceAccount
      kube_api_qps: 20
      kube_api_burst: 40
    reconnect_backoff:
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
    max_batch_size: 500
    flush_interval: 250ms
    max_log_size: 2097152
    max_log_size_behavior: truncate

processors:
  nop:

exporters:
  nop:

service:
  pipelines:
    logs:
      receivers: [k8s_pod_log]
      processors: [nop]
      exporters: [nop]