name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache vendor
        id: cache-vendor
        uses: actions/cache@v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-go-vendor-${{ hashFiles('go.sum') }}

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          # Kept in step with GOLANGCI_LINT_VERSION in the Makefile, so
          # `make lint` and this job report the same findings.
          # renovate: datasource=go depName=github.com/golangci/golangci-lint/v2
          version: v2.14.0

  license-headers:
    name: License headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Check SPDX headers on hand-written Go files
        run: make license-check
